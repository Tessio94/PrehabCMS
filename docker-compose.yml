services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prehab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prehab}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    profiles: ['app']
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prehab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prehab}
      NODE_ENV: production
      MEDIA_DIR: /app/media
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
